name: CMS draft cron (GitHub-hosted)

on:
  schedule:
    # After Notion producers and the existing WeChat delivery windows.
    - cron: '15 8 * * *'
      timezone: Asia/Shanghai
    - cron: '15 19 * * *'
      timezone: Asia/Shanghai
    - cron: '15 4 * * 1'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      profile:
        description: CMS column
        type: choice
        required: true
        options: [x, producthunt, trustmrr, overseas]
      mode:
        description: Read-only check or write an unpublished CMS draft
        type: choice
        required: true
        default: dry-run
        options: [dry-run, publish]
      period:
        description: Overseas story issue number (e.g. 01); required for overseas
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cms-publisher-dispatch
  cancel-in-progress: false

jobs:
  publish:
    # Fail closed until the owner enables this repository variable. The
    # dry-run dispatch remains available before production activation.
    if: ${{ vars.CMS_PUBLISHER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      CMS_INGEST_TOKEN: ${{ secrets.CMS_INGEST_TOKEN }}
      CMS_INGEST_URL: https://cms.qjai.org/api/ingest
      CMS_ENABLE_DRAFTS: 'true'
      CMS_X_ENABLED: 'true'
      CMS_PRODUCTHUNT_ENABLED: 'true'
      CMS_TRUSTMRR_ENABLED: 'true'
      CMS_OVERSEAS_ENABLED: ${{ vars.CMS_OVERSEAS_ENABLED == 'true' }}
      SCHEDULE: ${{ github.event.schedule }}
      EVENT: ${{ github.event_name }}
      MANUAL_PROFILE: ${{ inputs.profile }}
      MANUAL_MODE: ${{ inputs.mode }}
      MANUAL_PERIOD: ${{ inputs.period }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve fixed profile and operation
        id: choose
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "schedule" ]]; then
            case "$SCHEDULE" in
              '15 8 * * *') profile=x ;;
              '15 19 * * *') profile=producthunt ;;
              '15 4 * * 1') profile=trustmrr ;;
              *) echo 'Unknown cron expression' >&2; exit 2 ;;
            esac
            mode=run
          else
            case "$MANUAL_PROFILE" in
              x|producthunt|trustmrr|overseas) profile="$MANUAL_PROFILE" ;;
              *) echo 'Invalid manual profile' >&2; exit 2 ;;
            esac
            case "$MANUAL_MODE" in
              dry-run) mode=dry-run ;;
              publish) mode=run ;;
              *) echo 'Invalid manual mode' >&2; exit 2 ;;
            esac
          fi
          printf 'profile=%s\nmode=%s\n' "$profile" "$mode" >> "$GITHUB_OUTPUT"

      - name: Check required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$NOTION_API_KEY" && ${#CMS_INGEST_TOKEN} -ge 32 ]] || {
            echo 'NOTION_API_KEY or CMS_INGEST_TOKEN is missing' >&2
            exit 2
          }

      - name: Install publisher
        run: python -m pip install -e .

      - name: Create or confirm CMS draft
        env:
          PROFILE: ${{ steps.choose.outputs.profile }}
          MODE: ${{ steps.choose.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == "overseas" ]]; then
            [[ "$EVENT" == "workflow_dispatch" && "$MANUAL_PERIOD" =~ ^(0[1-9]|[1-9][0-9]{1,4})$ ]] || {
              echo 'Overseas manual dispatch requires issue number 01..99999' >&2
              exit 2
            }
            python -m cms_publisher "$MODE" --profile "$PROFILE" --period "$MANUAL_PERIOD"
          else
            python -m cms_publisher "$MODE" --profile "$PROFILE"
          fi
