[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-publisher"
version = "0.1.0"
description = "Fail-closed Notion to qjai-cms draft publisher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cms-publisher = "cms_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
